<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SocialMedia Archiv-Board</title>
<style>
  :root{--tinte:#1c2733;--tinte2:#5a6b76;--linie:#e3e8ec;--blau:#0a66c2;--gruen:#1a7f37;--orange:#b25e09;--rot:#b3261e;--bg:#f4f6f8}
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--tinte);background:var(--bg)}
  header{background:#fff;border-bottom:1px solid var(--linie);padding:14px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:5}
  h1{font-size:18px;margin:0}
  .tabs{display:flex;gap:6px;margin-left:auto}
  .tabs button{border:1px solid var(--linie);background:#fff;border-radius:18px;padding:6px 14px;cursor:pointer;font-size:13.5px}
  .tabs button.aktiv{background:var(--blau);border-color:var(--blau);color:#fff}
  .filterzeile{max-width:1060px;margin:14px auto 0;padding:0 22px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;font-size:13.5px;color:var(--tinte2)}
  .filterzeile label{display:flex;gap:6px;align-items:center;cursor:pointer}
  main{max-width:1060px;margin:0 auto;padding:12px 22px 60px}
  h2{font-size:15px;margin:22px 0 8px;color:var(--tinte2)}
  .karte{background:#fff;border:1px solid var(--linie);border-radius:10px;padding:12px 16px;margin-bottom:8px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .karte.uebernommen{border-left:4px solid var(--gruen)}
  .karte .info{flex:1;min-width:260px}
  .titel{font-weight:600}
  .meta{font-size:12.5px;color:var(--tinte2)}
  .meta a{color:var(--blau);text-decoration:none}
  .badge{font-size:11.5px;padding:2px 9px;border-radius:10px;background:var(--bg);color:var(--tinte2);white-space:nowrap}
  .badge.erfasst{background:#e8f2ec;color:var(--gruen)}
  .badge.in_bearbeitung{background:#fdf3e7;color:var(--orange)}
  .badge.archiviert{background:#eef1f4;color:var(--tinte2)}
  .badge.papierkorb{background:#faeceb;color:var(--rot)}
  .badge.mark-uebernommen{background:#e8f2ec;color:var(--gruen)}
  .aktionen{display:flex;gap:6px;flex-wrap:wrap}
  .aktionen button{border:1px solid var(--linie);background:#fff;border-radius:8px;padding:6px 9px;cursor:pointer;font-size:15px;line-height:1}
  .aktionen button:hover{background:var(--bg)}
  .aktionen button.gefahr{color:var(--rot);border-color:#eccfcd}
  .aktionen button.an{background:#e8f2ec;border-color:#bcd8c6}
  #status{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--tinte);color:#fff;padding:8px 18px;border-radius:20px;font-size:13.5px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:10}
  #status.sichtbar{opacity:1}
  .leer{color:var(--tinte2);padding:30px;text-align:center}
  .detail{flex-basis:100%;border-top:1px solid var(--linie);margin-top:10px;padding-top:12px}
  .detail pre{white-space:pre-wrap;font:13.5px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0 0 10px;color:var(--tinte)}
  .detail .fotos{display:flex;gap:10px;flex-wrap:wrap}
  .detail .fotos img{max-width:230px;max-height:170px;border-radius:8px;border:1px solid var(--linie);object-fit:cover}
  .overlay{position:fixed;inset:0;background:rgba(28,39,51,.45);z-index:20;overflow:auto}
  button.mehr{display:block;margin:2px 0 14px;border:1px dashed var(--linie);background:#fff;border-radius:8px;padding:6px 14px;cursor:pointer;font-size:13px;color:var(--tinte2)}
  button.mehr:hover{background:var(--bg)}
  /* Anmeldung */
  #anmeldung{max-width:420px;margin:14vh auto;background:#fff;border:1px solid var(--linie);border-radius:12px;padding:28px;text-align:center}
  #anmeldung a{color:var(--tinte2);font-size:13px}
  #anmeldung h2{margin:0 0 6px;color:var(--tinte)}
  #anmeldung p{color:var(--tinte2);font-size:13.5px}
  #anmeldung input{width:100%;padding:10px;border:1px solid var(--linie);border-radius:8px;font-size:15px;margin:10px 0}
  #anmeldung button{width:100%;padding:10px;border:0;border-radius:8px;background:var(--blau);color:#fff;font-size:15px;cursor:pointer}
  .kopf-knoepfe{display:flex;gap:6px;align-items:center}
  .kopf-knoepfe button{border:1px solid var(--linie);background:#fff;border-radius:8px;padding:5px 10px;cursor:pointer;font-size:12.5px}
  /* Aktualisierungslauf */
  #laufoverlay{position:fixed;inset:0;background:rgba(28,39,51,.45);display:flex;align-items:center;justify-content:center;z-index:20}
  .laufbox{background:#fff;border-radius:12px;padding:24px 28px;width:min(440px,90vw);text-align:center}
  .laufbox h2{margin:0 0 6px;color:var(--tinte)}
  .laufbox button{border:1px solid var(--linie);background:#fff;border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13px;margin:0 4px}
  .balken{height:10px;background:var(--linie);border-radius:5px;overflow:hidden;margin:14px 0 8px}
  .balken>div{height:100%;background:var(--blau);width:0%;transition:width .5s}
  .balken.warte>div{width:30%;animation:pendel 1.2s ease-in-out infinite alternate}
  @keyframes pendel{from{margin-left:0}to{margin-left:70%}}
</style>
</head>

<script>
// Datenprojekt "my-bench" — Lesen und Schreiben nur fuer angemeldete Nutzer (RLS, sm_nutzer).
const SM = { url: "https://pysdixrqptnojwqymarb.supabase.co",
             key: "sb_publishable_ASqlpYMdXVXFcR4ljQxtRQ_bFUDIrMm" };
const sb = window.supabase.createClient(SM.url, SM.key);
const app = document.getElementById("app");
let tab = "aktiv", posts = [], marken = {}, nutzerEmail = null, angemeldet = false;

const offen = new Set(), fotoUrls = {}, aufgeklappt = new Set();

function melde(text){
  const s = document.getElementById("status");
  s.textContent = text; s.classList.add("sichtbar");
  setTimeout(() => s.classList.remove("sichtbar"), 3200);
}
const esc = t => String(t).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fehlerText = e => /rate limit/i.test(e.message)
  ? "Zu viele Anmeldelinks angefordert — das Mail-Kontingent ist vorerst erschöpft. Bitte in etwa einer Stunde erneut versuchen."
  : e.message;
const quellenzeile = p => "Quelle: " + p.organisation + ", " +
  (p.datum ? new Date(p.datum).toLocaleDateString("de-AT") : "Datum unbekannt") + ", " + p.post_url;

// Zwischenablage mit Rueckfall auf den klassischen Kopierbefehl
async function inZwischenablage(text){
  try {
    await Promise.race([
      navigator.clipboard.writeText(text),
      new Promise((_, ab) => setTimeout(() => ab(new Error("Zeitüberschreitung")), 1500))
    ]);
    return true;
  } catch (e) {}
  const ta = document.createElement("textarea");
  ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.focus(); ta.select();
  let ok = false;
  try { ok = document.execCommand("copy"); } catch (e) {}
  ta.remove(); return ok;
}

function ladeDatei(href, name){
  const a = document.createElement("a");
  a.href = href; a.download = name || "";
  document.body.appendChild(a); a.click(); a.remove();
}

// Unkomprimiertes ZIP (Store) ohne fremde Bibliotheken
const crcTab = (() => { const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) { let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0; } return t; })();
const crc32 = b => { let c = 0xFFFFFFFF;
  for (let i = 0; i < b.length; i++) c = crcTab[(c ^ b[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0; };

function baueZip(dateien){ // dateien: [{name, daten: Uint8Array}]
  const enc = new TextEncoder(), teile = [], zentral = [];
  let offset = 0;
  dateien.forEach(f => {
    const name = enc.encode(f.name), crc = crc32(f.daten), n = f.daten.length;
    const lokal = new DataView(new ArrayBuffer(30));
    lokal.setUint32(0, 0x04034b50, true); lokal.setUint16(4, 20, true);
    lokal.setUint32(14, crc, true); lokal.setUint32(18, n, true); lokal.setUint32(22, n, true);
    lokal.setUint16(26, name.length, true);
    teile.push(lokal.buffer, name, f.daten);
    const z = new DataView(new ArrayBuffer(46));
    z.setUint32(0, 0x02014b50, true); z.setUint16(4, 20, true); z.setUint16(6, 20, true);
    z.setUint32(16, crc, true); z.setUint32(20, n, true); z.setUint32(24, n, true);
    z.setUint16(28, name.length, true); z.setUint32(42, offset, true);
    zentral.push(z.buffer, name);
    offset += 30 + name.length + n;
  });
  const zLaenge = zentral.reduce((s, t) => s + t.byteLength, 0);
  const ende = new DataView(new ArrayBuffer(22));
  ende.setUint32(0, 0x06054b50, true);
  ende.setUint16(8, dateien.length, true); ende.setUint16(10, dateien.length, true);
  ende.setUint32(12, zLaenge, true); ende.setUint32(16, offset, true);
  return new Blob([...teile, ...zentral, ende.buffer], { type: "application/zip" });
}

// ── Anmeldung (Overlay, optional — Lesen geht ohne) ──────────────────────────
function zeigeAnmeldung(hinweis){
  if (document.getElementById("loginoverlay")) return;
  document.body.insertAdjacentHTML("beforeend",
    '<div class="overlay" id="loginoverlay"><div id="anmeldung"><h2>📦 Anmeldung für Redaktion</h2>' +
    '<p>' + (hinweis || "Zum Bearbeiten (archivieren, markieren, aktualisieren) mit deiner freigeschalteten E-Mail-Adresse anmelden. Du bekommst einen Anmeldelink per Mail.") + '</p>' +
    '<input type="email" id="mail" placeholder="deine@mail.adresse" autocomplete="email">' +
    '<button id="senden">Anmeldelink schicken</button>' +
    '<p><a href="#" id="loginzu">Ohne Anmeldung weiterlesen</a></p></div></div>');
  document.getElementById("loginzu").addEventListener("click", e => {
    e.preventDefault(); document.getElementById("loginoverlay").remove();
  });
  document.getElementById("senden").addEventListener("click", async () => {
    const email = document.getElementById("mail").value.trim();
    if (!email.includes("@")) { melde("Bitte gültige E-Mail-Adresse eingeben."); return; }
    const { error } = await sb.auth.signInWithOtp({ email,
      options: { emailRedirectTo: location.origin + location.pathname } });
    melde(error ? "Fehler: " + fehlerText(error) : "Anmeldelink verschickt — bitte Postfach prüfen.");
  });
}

// ── Disclaimer (einmalige Bestätigung je Browser) ────────────────────────────
function zeigeDisclaimer(){
  if (localStorage.getItem("sm_disclaimer_ok")) return;
  document.body.insertAdjacentHTML("beforeend",
    '<div class="overlay" id="disclaimer"><div id="anmeldung" style="max-width:520px;text-align:left">' +
    '<h2 style="text-align:center">Hinweis zur Nutzung</h2>' +
    '<p>Die Inhalte dieses Boards stammen aus den Social-Media-Auftritten und Webseiten ' +
    'der Weltbund-Organisationen und des BMEIA (Außenministerium) und werden mit deren ' +
    'Einverständnis bereitgestellt.</p>' +
    '<p>Wer Texte oder Fotos kopiert, herunterlädt oder weiterverwendet, ist <b>eigenständig ' +
    'dafür verantwortlich</b>, die Nutzungsregeln der jeweiligen Organisation (z. B. BMEIA, ' +
    'Weltbund Österreich, Weltsteirer, Weltkärntner) und des Weltbund Österreich einzuhalten — ' +
    'einschließlich Quellen- und Urheberangaben.</p>' +
    '<button id="disclaimerok">Verstanden</button></div></div>');
  document.getElementById("disclaimerok").addEventListener("click", () => {
    localStorage.setItem("sm_disclaimer_ok", new Date().toISOString());
    document.getElementById("disclaimer").remove();
  });
}

async function start(){
  const { data: { session } } = await sb.auth.getSession();
  if (session) {
    nutzerEmail = session.user.email;
    const { data: istNutzer } = await sb.rpc("sm_ist_nutzer");
    if (istNutzer) { angemeldet = true; }
    else {
      await sb.auth.signOut();
      const mail = nutzerEmail; nutzerEmail = null;
      setTimeout(() => melde("Die Adresse " + mail + " ist (noch) nicht freigeschaltet — Lesezugriff ist trotzdem möglich."), 600);
    }
  }
  zeigeBoard();
  zeigeDisclaimer();
  await lade();
}

// ── Board ────────────────────────────────────────────────────────────────────
function zeigeBoard(){
  app.innerHTML =
    '<header><h1>📦 SocialMedia Archiv-Board</h1>' +
    '<span class="meta" id="zaehler"></span>' +
    '<div class="kopf-knoepfe">' + (angemeldet
      ? '<span class="meta">' + esc(nutzerEmail) + '</span>' +
        '<button id="lauf">🔄 Aktualisieren</button>' +
        '<button id="einladen">➕ Nutzer einladen</button>' +
        '<button id="abmelden">Abmelden</button>'
      : '<button id="anmelden">🔑 Anmelden (Redaktion)</button>') + '</div>' +
    '<nav class="tabs"><button data-tab="aktiv" class="aktiv">Aktiv</button>' +
    '<button data-tab="archiviert">Archiv</button>' +
    (angemeldet ? '<button data-tab="papierkorb">Papierkorb</button>' : '') + '</nav></header>' +
    '<div class="filterzeile">' +
    '<label><input type="checkbox" id="f30" checked> Nur letzte 30 Tage</label>' +
    (angemeldet ? '<label><input type="checkbox" id="fausgeblendet"> Ausgeblendete ("nicht interessant") anzeigen</label>' : '') +
    '<span>Nutzung nur gemäß den Regeln der jeweiligen Organisation — Verantwortung liegt bei den Nutzenden.</span>' +
    '<span>Hinweis: Facebook-Videos/Reels ohne Foto werden nicht erfasst.</span>' +
    '</div><main id="inhalt"><p class="leer">Lade Daten …</p></main>';
  document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => {
    tab = b.dataset.tab;
    document.querySelectorAll(".tabs button").forEach(x => x.classList.toggle("aktiv", x === b));
    zeichne();
  }));
  document.getElementById("f30").addEventListener("change", e => { nur30Tage = e.target.checked; zeichne(); });
  if (angemeldet) {
    document.getElementById("fausgeblendet").addEventListener("change", e => { zeigeAusgeblendete = e.target.checked; zeichne(); });
    document.getElementById("abmelden").addEventListener("click", async () => { await sb.auth.signOut(); location.reload(); });
    document.getElementById("einladen").addEventListener("click", einladen);
    document.getElementById("lauf").addEventListener("click", starteLauf);
  } else {
    document.getElementById("anmelden").addEventListener("click", () => zeigeAnmeldung());
  }
}

// ── Aktualisierungslauf (manuell angefordert, ausgefuehrt auf Michaels Mac) ──
let laufTimer = null;

async function starteLauf(){
  const offenQ = await sb.from("sm_laeufe").select("id")
    .in("status", ["angefordert", "laeuft"]).order("id", { ascending: false }).limit(1);
  if (offenQ.error) { melde("Fehler: " + offenQ.error.message); return; }
  if (offenQ.data.length) { zeigeLauf(offenQ.data[0].id); return; }
  const letzt = await sb.from("sm_laeufe").select("beendet_am").eq("status", "fertig")
    .order("id", { ascending: false }).limit(1);
  if (letzt.data && letzt.data.length && letzt.data[0].beendet_am) {
    const rest = 60 * 60 * 1000 - (Date.now() - new Date(letzt.data[0].beendet_am).getTime());
    if (rest > 0) { melde("Frühestens " + Math.ceil(rest / 60000) + " Minuten nach dem letzten Lauf möglich."); return; }
  }
  const ins = await sb.from("sm_laeufe").insert({ angefordert_von: nutzerEmail }).select("id").single();
  if (ins.error) { melde("Fehler: " + ins.error.message); return; }
  zeigeLauf(ins.data.id);
}

function zeigeLauf(id){
  schliesseLauf();
  document.body.insertAdjacentHTML("beforeend",
    '<div id="laufoverlay"><div class="laufbox"><h2>🔄 Aktualisierungslauf</h2>' +
    '<div class="meta" id="laufstatus">Stand wird geladen …</div>' +
    '<div class="balken warte" id="laufbalken"><div></div></div>' +
    '<div class="meta" id="laufprozent"></div>' +
    '<div style="margin-top:12px"><button id="laufzu">Im Hintergrund weiter</button>' +
    '<button id="laufabbruch">Anforderung abbrechen</button></div></div></div>');
  document.getElementById("laufzu").addEventListener("click", schliesseLauf);
  document.getElementById("laufabbruch").addEventListener("click", async () => {
    const q = await sb.from("sm_laeufe").update({ status: "abgebrochen" })
      .eq("id", id).eq("status", "angefordert");
    if (q.error) { melde("Fehler: " + q.error.message); return; }
    schliesseLauf(); melde("Anforderung abgebrochen.");
  });
  laufPoll(id);
  laufTimer = setInterval(() => laufPoll(id), 5000);
}

function schliesseLauf(){
  if (laufTimer) { clearInterval(laufTimer); laufTimer = null; }
  const o = document.getElementById("laufoverlay");
  if (o) o.remove();
}

async function laufPoll(id){
  const q = await sb.from("sm_laeufe").select("*").eq("id", id).single();
  if (q.error) return;
  const l = q.data, balken = document.getElementById("laufbalken");
  if (!balken) return;
  const statusEl = document.getElementById("laufstatus"), proz = document.getElementById("laufprozent");
  if (l.status === "angefordert") {
    balken.classList.add("warte");
    statusEl.textContent = "Wartet auf den Arbeitsrechner … (er muss wach sein, Prüfung jede Minute)";
    proz.textContent = "angefordert von " + l.angefordert_von;
  } else if (l.status === "laeuft") {
    balken.classList.remove("warte");
    balken.firstElementChild.style.width = l.fortschritt + "%";
    statusEl.textContent = l.status_text || "Lauf gestartet …";
    proz.textContent = l.fortschritt + " %";
    document.getElementById("laufabbruch").style.display = "none";
  } else if (l.status === "fertig") {
    schliesseLauf(); melde("Aktualisierung abgeschlossen — Daten werden neu geladen.");
    await lade();
  } else if (l.status === "fehler") {
    schliesseLauf(); melde("Lauf fehlgeschlagen: " + (l.status_text || "unbekannter Fehler"));
  } else if (l.status === "abgebrochen") {
    schliesseLauf(); melde("Anforderung wurde abgebrochen.");
  }
}

async function einladen(){
  const email = (prompt("E-Mail-Adresse der einzuladenden Person:") || "").trim();
  if (!email.includes("@")) { if (email) melde("Keine gültige Adresse."); return; }
  const { error } = await sb.from("sm_nutzer").insert({ email, eingeladen_von: nutzerEmail });
  if (error && !String(error.message).includes("duplicate")) { melde("Fehler: " + error.message); return; }
  const otp = await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: location.origin + location.pathname } });
  melde(otp.error
    ? email + " freigeschaltet, aber der Anmeldelink konnte nicht verschickt werden: " + fehlerText(otp.error)
    : email + " freigeschaltet — Anmeldelink wurde per Mail verschickt.");
}

async function lade(){
  const [p, m] = await Promise.all([
    sb.from("sm_posts")
      .select("urn,dienst,organisation,datum,titel,status,post_url,text,geloescht_am,sm_bilder(id,dateiname,sort)")
      .order("datum", { ascending: false }),
    angemeldet ? sb.from("sm_markierungen").select("urn,markierung") : Promise.resolve({ data: [] })
  ]);
  if (p.error) { document.getElementById("inhalt").innerHTML = '<p class="leer">Fehler beim Laden: ' + esc(p.error.message) + "</p>"; return; }
  posts = p.data;
  marken = {};
  (m.data || []).forEach(r => { (marken[r.urn] = marken[r.urn] || new Set()).add(r.markierung); });
  zeichne();
}

function zeichne(){
  const statusFilter = { aktiv: p => p.status === "erfasst" || p.status === "in_bearbeitung",
                         archiviert: p => p.status === "archiviert",
                         papierkorb: p => p.status === "papierkorb" }[tab];
  const grenze = Date.now() - 30 * 24 * 3600 * 1000;
  let auswahl = posts.filter(statusFilter);
  if (nur30Tage) auswahl = auswahl.filter(p => p.datum && new Date(p.datum).getTime() >= grenze);
  const ausgeblendet = auswahl.filter(p => (marken[p.urn] || new Set()).has("nicht_interessant"));
  if (!zeigeAusgeblendete) auswahl = auswahl.filter(p => !(marken[p.urn] || new Set()).has("nicht_interessant"));
  const main = document.getElementById("inhalt");
  document.getElementById("zaehler").textContent =
    posts.length + " Posts gesamt · " + auswahl.length + " angezeigt" +
    (!zeigeAusgeblendete && ausgeblendet.length ? " · " + ausgeblendet.length + " ausgeblendet" : "");
  if (!auswahl.length) { main.innerHTML = '<p class="leer">Keine Einträge in dieser Ansicht.</p>'; return; }
  const orgs = [...new Set(auswahl.map(p => p.organisation))].sort();
  main.innerHTML = orgs.map(org => {
    const liste = auswahl.filter(p => p.organisation === org);
    const alle = aufgeklappt.has(tab + "|" + org);
    const sichtbar = alle ? liste : liste.slice(0, 5);
    let html = "<h2>" + esc(org) + "</h2>" + sichtbar.map(p => karte(p)).join("");
    if (liste.length > 5)
      html += '<button class="mehr" data-org="' + esc(org) + '">' +
        (alle ? "weniger anzeigen" : "mehr anzeigen (" + (liste.length - 5) + " weitere)") + "</button>";
    return html;
  }).join("");
  main.querySelectorAll("button.mehr").forEach(b => b.addEventListener("click", () => {
    const k = tab + "|" + b.dataset.org;
    aufgeklappt.has(k) ? aufgeklappt.delete(k) : aufgeklappt.add(k);
    zeichne();
  }));
}

function karte(p){
  const meineMarken = marken[p.urn] || new Set();
  const datum = p.datum ? new Date(p.datum).toLocaleDateString("de-AT") : "–";
  const dienst = { linkedin: "LinkedIn", instagram: "Instagram", facebook: "Facebook", web: "Webseite" }[p.dienst] || p.dienst;
  const meta = datum + (p.sm_bilder.length ? " · " + p.sm_bilder.length + " Bild(er)" : "") + " · " + dienst +
    ' · <a href="' + esc(p.post_url) + '" target="_blank">Original ↗</a>';
  const a = [btn(p.urn, "details", "📄", p.sm_bilder.length ? "Text und " + p.sm_bilder.length + " Foto(s) anzeigen" : "Text anzeigen")];
  a.push(btn(p.urn, "kopieren", "📋", "Text + Quellenzeile in die Zwischenablage kopieren"));
  if (p.sm_bilder.length)
    a.push(btn(p.urn, "fotos", "📥", p.sm_bilder.length + " Foto(s) in den Download-Ordner speichern"));
  if (angemeldet) {
    a.push(btn(p.urn, "uebernommen", "✔", (meineMarken.has("uebernommen") ? "Übernommen-Markierung entfernen" : "Als übernommen markieren"), false, meineMarken.has("uebernommen")));
    a.push(btn(p.urn, "uninteressant", (meineMarken.has("nicht_interessant") ? "👁" : "🚫"), (meineMarken.has("nicht_interessant") ? "Wieder einblenden" : "Nicht interessant — für mich ausblenden")));
    if (p.status === "erfasst" || p.status === "in_bearbeitung")
      a.push(btn(p.urn, "archivieren", "📦", "Archivieren"), btn(p.urn, "papierkorb", "🗑️", "In den Papierkorb"));
    if (p.status === "archiviert")
      a.push(btn(p.urn, "reaktivieren", "♻️", "Reaktivieren"), btn(p.urn, "papierkorb", "🗑️", "In den Papierkorb"));
    if (p.status === "papierkorb")
      a.push(btn(p.urn, "reaktivieren", "♻️", "Wiederherstellen"), btn(p.urn, "loeschen", "❌", "Endgültig löschen", true));
  }
  const detail = offen.has(p.urn)
    ? '<div class="detail"><pre>' + esc(p.text || "(kein Text gespeichert)") + "</pre>" +
      '<p class="meta">' + esc(quellenzeile(p)) + "</p>" +
      (p.sm_bilder.length ? '<div class="fotos">' + p.sm_bilder.sort((x, y) => x.sort - y.sort)
        .map(b => fotoUrls[b.dateiname]
          ? '<a href="' + fotoUrls[b.dateiname] + '" target="_blank"><img src="' + fotoUrls[b.dateiname] + '" alt=""></a>'
          : '<span class="meta">Lade Foto …</span>').join("") + "</div>" : "") +
      "</div>"
    : "";
  return '<div class="karte' + (meineMarken.has("uebernommen") ? " uebernommen" : "") + '">' +
    '<div class="info"><div class="titel">' + esc(p.titel || String(p.urn)) + "</div>" +
    '<div class="meta">' + meta + "</div></div>" +
    (meineMarken.has("uebernommen") ? '<span class="badge mark-uebernommen">übernommen</span>' : "") +
    '<span class="badge ' + p.status + '">' + p.status.replace("_", " ") + "</span>" +
    '<div class="aktionen">' + a.join("") + "</div>" + detail + "</div>";
}
const btn = (urn, ak, icon, tipp, gefahr, an) =>
  '<button class="' + (gefahr ? "gefahr" : "") + (an ? " an" : "") + '" title="' + tipp + "\" onclick=\"aktion('" + urn + "','" + ak + "')\">" + icon + "</button>";

async function aktion(urn, ak){
  const p = posts.find(x => String(x.urn) === String(urn));
  if (!angemeldet && ak !== "details" && ak !== "kopieren" && ak !== "fotos") return;
  if (ak === "details") {
    if (offen.has(urn)) { offen.delete(urn); zeichne(); return; }
    offen.add(urn);
    if (p && p.sm_bilder.length) {
      const namen = p.sm_bilder.map(b => b.dateiname).filter(n => !fotoUrls[n]);
      if (namen.length) {
        const { data } = await sb.storage.from("sm-bilder").createSignedUrls(namen, 3600);
        (data || []).forEach(e => { if (e.signedUrl) fotoUrls[e.path] = e.signedUrl; });
      }
    }
    zeichne(); return;
  }
  if (ak === "fotos") {
    if (!p || !p.sm_bilder.length) return;
    const namen = p.sm_bilder.sort((x, y) => x.sort - y.sort).map(b => b.dateiname);
    const { data, error } = await sb.storage.from("sm-bilder").createSignedUrls(namen, 3600, { download: true });
    if (error) { melde("Fehler: " + error.message); return; }
    const urls = (data || []).filter(e => e.signedUrl);
    if (!urls.length) { melde("Keine Fotos gefunden."); return; }
    if (urls.length === 1) {
      ladeDatei(urls[0].signedUrl);
      melde("Foto wird in den Download-Ordner gespeichert.");
      return;
    }
    melde(urls.length + " Fotos werden als ZIP gepackt …");
    try {
      const dateien = [];
      for (const e of urls) {
        const r = await fetch(e.signedUrl);
        if (!r.ok) throw new Error("Foto-Abruf fehlgeschlagen (" + r.status + ")");
        dateien.push({ name: (e.path || "foto.jpg").split("/").pop(),
                       daten: new Uint8Array(await r.arrayBuffer()) });
      }
      const zipName = dateien[0].name.replace(/_\d+\.[a-z]+$/i, "") + "_fotos.zip";
      const url = URL.createObjectURL(baueZip(dateien));
      ladeDatei(url, zipName);
      setTimeout(() => URL.revokeObjectURL(url), 60000);
      melde(dateien.length + " Fotos als " + zipName + " in den Download-Ordner gespeichert.");
    } catch (e) { melde("Foto-Download fehlgeschlagen: " + e.message); }
    return;
  }
  if (ak === "kopieren") {
    if (!p) return;
    const ok = await inZwischenablage((p.text || "") + "\n\n" + quellenzeile(p));
    melde(ok ? "Text + Quellenzeile in die Zwischenablage kopiert."
             : "Kopieren nicht möglich — bitte den Text über 📄 Details öffnen und manuell kopieren.");
    return;
  }
  if (ak === "uebernommen" || ak === "uninteressant") {
    const markierung = ak === "uebernommen" ? "uebernommen" : "nicht_interessant";
    const hat = (marken[urn] || new Set()).has(markierung);
    const q = hat
      ? await sb.from("sm_markierungen").delete().match({ email: nutzerEmail, urn, markierung })
      : await sb.from("sm_markierungen").insert({ email: nutzerEmail, urn, markierung });
    melde(q.error ? "Fehler: " + q.error.message :
      (hat ? "Markierung entfernt." : (markierung === "uebernommen" ? "Als übernommen markiert." : "Ausgeblendet — über den Filter wieder sichtbar.")));
    const [m] = [await sb.from("sm_markierungen").select("urn,markierung")];
    marken = {};
    (m.data || []).forEach(r => { (marken[r.urn] = marken[r.urn] || new Set()).add(r.markierung); });
    zeichne(); return;
  }
  if (ak === "loeschen") {
    if (!confirm("Diesen Eintrag ENDGÜLTIG löschen? Datensatz und Bilder werden aus Datenbank und Storage entfernt. Die lokalen Vault-Dateien bleiben bestehen.")) return;
    if (p && p.sm_bilder.length)
      await sb.storage.from("sm-bilder").remove(p.sm_bilder.map(b => b.dateiname));
    const r = await sb.from("sm_posts").delete().eq("urn", urn);
    melde(r.error ? "Fehler: " + r.error.message : "Endgültig gelöscht.");
  } else {
    const neu = { archivieren: { status: "archiviert", geloescht_am: null },
                  papierkorb: { status: "papierkorb", geloescht_am: new Date().toISOString() },
                  reaktivieren: { status: "erfasst", geloescht_am: null } }[ak];
    const r = await sb.from("sm_posts").update(neu).eq("urn", urn);
    melde(r.error ? "Fehler: " + r.error.message : "Gespeichert: " + neu.status);
  }
  await lade();
}

start();
</script>
